<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

  </head>
  <body>
    <nav><a href="./index.html">← all tests</a></nav>
    <h1>Search box, not a login</h1>
    <p class="expect">An unmarked text field with no password anywhere. It must get <b>no</b>
    passio button — otherwise every search box on the web would sprout one. This one is
    judged by eye: look at the right-hand end of the field.</p>
    <form onsubmit="return false">
  <label for="q">Search</label>
  <input id="q" data-label="the search box" type="text" placeholder="Search…" />
  <button>Search</button>
</form>
    <script>
      window.PASSIO_TEST = { mustStayEmpty: ['q'] };
    </script>
    <script src="./verify.js"></script>
  </body>
