<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Disabled and read-only — passio autofill test</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav><a href="./index.html">← all tests</a></nav>
    <h1>Disabled and read-only</h1>
    <p class="expect">
  Neither field may be filled or decorated with a button.
</p>
    <form onsubmit="return false">
  <label for="u">Username (disabled)</label>
  <input id="u" type="text" autocomplete="username" disabled />
  <label for="p">Password (read-only)</label>
  <input id="p" type="password" readonly value="" />
  <button>Sign in</button>
</form>
  </body>
</html>
