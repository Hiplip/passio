<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hidden password trap — passio autofill test</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav><a href="./index.html">← all tests</a></nav>
    <h1>Hidden password trap</h1>
    <p class="expect">
  There is an off-screen password field above the visible one. Only the <b>visible</b>
  field may be filled.<br />
  Check in the console: <code>document.getElementById('trap').value</code> must be
  <code>''</code>.
</p>
    <form onsubmit="return false">
  <input id="trap" class="trap" type="password" name="password"
         autocomplete="current-password" tabindex="-1" aria-hidden="true" />
  <label for="u">Username</label>
  <input id="u" name="username" type="text" autocomplete="username" />
  <label for="p">Password</label>
  <input id="p" name="realpassword" type="password" />
  <button>Sign in</button>
</form>
  </body>
</html>
