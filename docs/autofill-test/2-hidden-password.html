<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hidden password trap — passio autofill test</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav><a href="./index.html">← all tests</a></nav>
    <h1>Hidden password trap</h1>
    <p class="expect">An off-screen password field sits above the visible one. Only the
    <b>visible</b> field may be filled. The box at the bottom watches the hidden one.</p>
    <form onsubmit="return false">
  <input id="trap" data-label="the hidden password field" class="trap" type="password"
         name="password" autocomplete="current-password" tabindex="-1" aria-hidden="true" />
  <label for="u">Username</label>
  <input id="u" data-label="username" name="username" type="text" autocomplete="username" />
  <label for="p">Password</label>
  <input id="p" data-label="password" name="realpassword" type="password" />
  <button>Sign in</button>
</form>
    <script>
      window.PASSIO_TEST = { mustFill: ['u', 'p'], mustStayEmpty: ['trap'] };
    </script>
    <script src="./verify.js"></script>
  </body>
</html>
