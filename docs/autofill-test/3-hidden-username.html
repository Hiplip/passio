<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hidden username trap — passio autofill test</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav><a href="./index.html">← all tests</a></nav>
    <h1>Hidden username trap</h1>
    <p class="expect">An off-screen text field marked <code>autocomplete="username"</code> — the
    strongest hint there is, deliberately. It must stay empty.</p>
    <form onsubmit="return false">
  <input id="trap" data-label="the hidden username field" class="trap" type="text"
         name="username" autocomplete="username" tabindex="-1" aria-hidden="true" />
  <label for="u">Email</label>
  <input id="u" data-label="email" type="email" />
  <label for="p">Password</label>
  <input id="p" data-label="password" type="password" />
  <button>Sign in</button>
</form>
    <script>
      window.PASSIO_TEST = { mustFill: ['u', 'p'], mustStayEmpty: ['trap'] };
    </script>
    <script src="./verify.js"></script>
  </body>
</html>
